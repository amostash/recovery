<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0B1F2A;--ink2:#3A4C57;--muted:#7C8B95;
  --paper:#FFF;--paper2:#F2F6F9;--paper3:#E8EFF4;
  --line:#DFE8EE;--line2:#C3D2DC;
  --brand:#0077C8;--brand-d:#005C9C;--brand2:#92278F;
  --go:#0E7C5A;--go-bg:#E6F4EF;
  --time:#B36A00;--time-bg:#FDF1DF;
  --stop:#B03A2E;--stop-bg:#FBEAE7;
  --neutral:#5A6B76;--neutral-bg:#EEF3F6;
  --tierA:#0E7C5A;--tierB:#0077C8;--tierC:#B36A00;--tierH:#7C8B95;
  --display:'Playfair Display',Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:14px;--r-sm:9px;--r-xs:6px;
  --sh:0 1px 2px rgba(11,31,42,.05),0 4px 16px rgba(11,31,42,.05);
  --sh-lg:0 10px 40px rgba(11,31,42,.13);
  --ease:cubic-bezier(.22,1,.36,1);
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper2);color:var(--ink);
  -webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:left}
input,select{font-family:inherit;font-size:1rem}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* Hero */
.hero{position:relative;border-radius:var(--r);overflow:hidden;margin:0 0 20px;
  background:linear-gradient(140deg,#0B1F2A 0%,#123449 45%,#0077C8 130%);
  aspect-ratio:16/9;box-shadow:var(--sh)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:.62;filter:saturate(.85)}
.hero::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(11,31,42,.15) 0%,rgba(11,31,42,.55) 62%,rgba(11,31,42,.88) 100%)}
.hero-txt{position:absolute;left:0;right:0;bottom:0;padding:16px 17px;z-index:2}
.hero-kicker{font-family:var(--mono);font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.72);font-weight:600;margin-bottom:7px}
.hero-h{font-family:var(--display);font-size:1.72rem;line-height:1.08;font-weight:500;
  letter-spacing:-.02em;color:#fff}
.hero-h em{font-style:normal;color:#7DD3FC}

/* Shell */
.shell{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--paper);
  box-shadow:0 0 0 1px var(--line);position:relative;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:56px}
.topbar img{height:19px;width:auto;display:block}
.tb-sub{font-family:var(--mono);font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);margin-left:auto;text-align:right;line-height:1.4}
.burger{width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;flex-shrink:0;transition:background .18s}
.burger:hover{background:var(--paper3)}
.burger span{display:block;width:19px;height:2px;background:var(--ink);border-radius:2px;position:relative;transition:transform .3s var(--ease)}
.burger span::before,.burger span::after{content:'';position:absolute;left:0;width:19px;height:2px;
  background:var(--ink);border-radius:2px;transition:transform .3s var(--ease)}
.burger span::before{top:-6px}.burger span::after{top:6px}
.burger.open span{background:transparent}
.burger.open span::before{transform:translateY(6px) rotate(45deg)}
.burger.open span::after{transform:translateY(-6px) rotate(-45deg)}
.page{flex:1;padding:20px 18px 90px;animation:rise .38s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(11,31,42,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);background:var(--paper);z-index:80;
  transform:translateX(-102%);transition:transform .34s var(--ease);display:flex;flex-direction:column;box-shadow:var(--sh-lg)}
.drawer.on{transform:none}
.drawer-head{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.drawer-head img{height:20px;margin-bottom:9px;display:block}
.who{font-size:.82rem;font-weight:600}.who span{color:var(--muted);font-weight:400}
.drawer-body{flex:1;overflow-y:auto;padding:8px 0 30px}
.nav-grp{font-family:var(--mono);font-size:.54rem;letter-spacing:.17em;text-transform:uppercase;
  color:var(--muted);padding:14px 20px 5px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 20px;font-size:.85rem;
  font-weight:500;color:var(--ink2);border-left:3px solid transparent;transition:background .15s}
.nav-item:hover{background:var(--paper2)}
.nav-item.active{color:var(--brand);border-left-color:var(--brand);background:var(--paper2);font-weight:600}
.nav-item.locked{color:var(--line2);cursor:not-allowed}
.nav-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.nav-tag{margin-left:auto;font-family:var(--mono);font-size:.53rem;letter-spacing:.07em;
  padding:2px 5px;border-radius:4px;font-weight:700;white-space:nowrap}

/* Type */
.eyebrow{font-family:var(--mono);font-size:.59rem;letter-spacing:.19em;text-transform:uppercase;
  color:var(--brand);font-weight:600;margin-bottom:8px}
h1.title{font-family:var(--display);font-size:1.68rem;line-height:1.15;font-weight:500;
  letter-spacing:-.015em;margin-bottom:9px}
h2.sub{font-size:1rem;font-weight:650;letter-spacing:-.01em;margin:22px 0 10px}
.lede{font-size:.885rem;line-height:1.62;color:var(--ink2)}
p.body{font-size:.845rem;line-height:1.66;color:var(--ink2)}
.small{font-size:.735rem;line-height:1.58;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.rule{height:1px;background:var(--line);margin:20px 0}

/* Cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.card.flat{background:var(--paper2);border-color:transparent}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.ch-t{font-size:.81rem;font-weight:700;letter-spacing:-.005em}
.ch-n{margin-left:auto;font-family:var(--mono);font-size:.61rem;color:var(--muted)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;
  border-radius:var(--r-sm);font-size:.9rem;font-weight:600;transition:transform .12s,background .2s}
.btn:active{transform:scale(.985)}
.btn-p{background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,119,200,.25)}
.btn-p:hover{background:var(--brand-d)}
.btn-p:disabled{background:var(--line2);box-shadow:none;cursor:not-allowed}
.btn-s{background:var(--paper2);color:var(--ink);border:1px solid var(--line)}
.btn-s:hover{background:var(--paper3)}
.btn-ghost{color:var(--brand);font-size:.8rem;font-weight:600;padding:9px 0;text-align:center;width:100%}

/* Forms */
.field{margin-bottom:14px}
.label{display:block;font-family:var(--mono);font-size:.57rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:7px}
.input{width:100%;padding:12px 13px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--paper)}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,119,200,.12)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:9px 13px;border:1px solid var(--line2);border-radius:99px;font-size:.79rem;font-weight:500;
  color:var(--ink2);background:var(--paper);transition:all .16s}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.src{display:flex;gap:12px;align-items:flex-start;width:100%;padding:13px;border:1.5px solid var(--line);
  border-radius:var(--r);margin-bottom:9px;background:var(--paper);transition:all .18s}
.src.on{border-color:var(--brand);background:linear-gradient(180deg,rgba(0,119,200,.05),transparent)}
.src-box{width:20px;height:20px;border-radius:var(--r-xs);border:1.5px solid var(--line2);flex-shrink:0;
  margin-top:2px;display:grid;place-items:center;color:#fff;font-size:.68rem;transition:all .18s}
.src.on .src-box{background:var(--brand);border-color:var(--brand)}
.src-t{font-size:.86rem;font-weight:650;margin-bottom:3px;display:flex;align-items:center;gap:7px}
.src-d{font-size:.735rem;line-height:1.52;color:var(--muted);display:block}
.src-tag{font-family:var(--mono);font-size:.52rem;letter-spacing:.09em;padding:2px 5px;border-radius:3px;
  background:var(--paper3);color:var(--neutral);font-weight:700}

/* Verdict */
.verdict{border-radius:var(--r);padding:15px 16px;margin-bottom:14px;border:1px solid;position:relative;overflow:hidden}
.verdict::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.v-go{background:var(--go-bg);border-color:rgba(14,124,90,.22);color:var(--go)}.v-go::before{background:var(--go)}
.v-time{background:var(--time-bg);border-color:rgba(179,106,0,.22);color:var(--time)}.v-time::before{background:var(--time)}
.v-stop{background:var(--stop-bg);border-color:rgba(176,58,46,.22);color:var(--stop)}.v-stop::before{background:var(--stop)}
.v-neutral{background:var(--neutral-bg);border-color:var(--line);color:var(--neutral)}.v-neutral::before{background:var(--neutral)}
.v-label{font-family:var(--mono);font-size:.57rem;letter-spacing:.17em;text-transform:uppercase;font-weight:700;margin-bottom:6px;opacity:.88}
.v-call{font-family:var(--display);font-size:1.24rem;line-height:1.2;font-weight:500;margin-bottom:7px}
.v-why{font-size:.795rem;line-height:1.6;color:var(--ink2)}

/* Pills */
.pill{font-family:var(--mono);font-size:.54rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  padding:4px 8px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.p-go{background:var(--go-bg);color:var(--go)}.p-time{background:var(--time-bg);color:var(--time)}
.p-stop{background:var(--stop-bg);color:var(--stop)}.p-neutral{background:var(--neutral-bg);color:var(--neutral)}

/* Tier badge */
.tier{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:.53rem;
  letter-spacing:.09em;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid;white-space:nowrap}
.t-A{color:var(--tierA);border-color:rgba(14,124,90,.35);background:var(--go-bg)}
.t-B{color:var(--tierB);border-color:rgba(0,119,200,.3);background:rgba(0,119,200,.07)}
.t-C{color:var(--tierC);border-color:rgba(179,106,0,.3);background:var(--time-bg)}
.t-H{color:var(--tierH);border-color:var(--line2);background:var(--paper2)}

/* Accordion */
.acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden;background:var(--paper)}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;padding:14px 15px;transition:background .16s}
.acc-h:hover{background:var(--paper2)}
.acc-t{font-size:.85rem;font-weight:650;flex:1;min-width:0}
.acc-n{font-family:var(--mono);font-size:.6rem;color:var(--muted)}
.acc-car{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .26s var(--ease);flex-shrink:0}
.acc.open .acc-car{transform:rotate(-135deg) translate(-3px,-3px)}
.acc-b{padding:0 15px 15px;border-top:1px solid var(--line);padding-top:13px}

/* Rule card */
.rc{border-bottom:1px solid var(--line);padding:11px 0}
.rc:last-child{border-bottom:none;padding-bottom:0}
.rc-h{display:flex;gap:9px;align-items:flex-start;width:100%}
.rc-src{font-family:var(--mono);font-size:.51rem;letter-spacing:.09em;font-weight:700;padding:3px 5px;
  border-radius:4px;flex-shrink:0;width:52px;text-align:center;margin-top:1px}
.s-dna{background:rgba(0,119,200,.11);color:var(--brand)}
.s-blood{background:rgba(176,58,46,.1);color:var(--stop)}
.s-ppg{background:rgba(146,39,143,.1);color:var(--brand2)}
.s-session{background:rgba(14,124,90,.1);color:var(--go)}
.s-goal{background:var(--paper3);color:var(--neutral)}
.rc-b{flex:1;min-width:0}
.rc-t{font-size:.795rem;font-weight:650;line-height:1.4;margin-bottom:3px}
.rc-say{font-size:.75rem;line-height:1.56;color:var(--ink2)}
.rc-more{font-family:var(--mono);font-size:.56rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--brand);font-weight:700;margin-top:7px}
.rc-detail{margin-top:9px;background:var(--paper2);border-radius:var(--r-sm);padding:11px 12px}
.kv{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv-k{font-family:var(--mono);font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:700;width:86px;flex-shrink:0;padding-top:2px}
.kv-v{font-size:.75rem;line-height:1.52;color:var(--ink);flex:1;min-width:0}
.kv-v.m{font-family:var(--mono);font-size:.72rem}

/* Contribution */
.stack{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--paper3);margin-bottom:9px}
.stack i{display:block;height:100%;transition:width .5s var(--ease)}
.stack-key{display:flex;gap:12px;flex-wrap:wrap}
.stack-key span{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.59rem;color:var(--muted)}
.stack-key i{width:8px;height:8px;border-radius:2px;display:block}

/* Rail */
.rail{position:relative;margin:4px 0;padding:22px 0 4px}
.rail-line{position:absolute;left:0;right:0;top:28px;height:2px;background:var(--paper3);border-radius:2px}
.rail-marks{position:relative;display:flex;justify-content:space-between}
.rail-m{position:relative;flex:1;text-align:center;z-index:2}
.rm-dot{width:11px;height:11px;border-radius:50%;background:var(--paper3);margin:0 auto 7px;border:2px solid var(--paper)}
.rail-m.hit .rm-dot{background:var(--acc)}
.rail-m.avoid .rm-dot{background:var(--stop)}
.rail-m.care .rm-dot{background:var(--time)}
.rm-l{font-family:var(--mono);font-size:.52rem;letter-spacing:.05em;color:var(--muted);line-height:1.32;text-transform:uppercase}
.rail-m.hit .rm-l{color:var(--ink);font-weight:700}
.rail-m.avoid .rm-l{color:var(--stop);font-weight:700}
.rail-m.care .rm-l{color:var(--time);font-weight:700}
.rail-cap{position:absolute;top:0;left:0;right:0;font-family:var(--mono);font-size:.54rem;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted);text-align:center}

/* Dose */
.dose{background:var(--ink);color:#fff;border-radius:var(--r);padding:15px;margin-bottom:12px}
.d-lab{font-family:var(--mono);font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.55);margin-bottom:9px}
.dose-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.11)}
.dose-row:last-child{border-bottom:none;padding-bottom:0}
.dk{font-size:.77rem;color:rgba(255,255,255,.66)}
.dv{font-family:var(--mono);font-size:.8rem;font-weight:600;text-align:right}

/* Group tiles */
.grp-h{display:flex;align-items:center;gap:9px;width:100%;padding:11px 2px;margin-top:6px}
.grp-t{font-family:var(--mono);font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;font-weight:700}
.grp-c{font-family:var(--mono);font-size:.6rem;color:var(--muted);margin-left:auto}
.tile{display:flex;align-items:center;gap:12px;width:100%;padding:13px;border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:9px;background:var(--paper);transition:box-shadow .2s,border-color .2s}
.tile:hover{border-color:var(--line2);box-shadow:var(--sh)}
.tile-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:1.05rem;flex-shrink:0}
.tile-b{flex:1;min-width:0}
.tile-t{font-size:.875rem;font-weight:650;margin-bottom:2px;display:block}
.tile-d{font-size:.725rem;color:var(--muted);line-height:1.42;display:block}

/* Notes / banners */
.note{background:var(--paper2);border-left:3px solid var(--brand);border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:12px 13px;font-size:.78rem;line-height:1.6;color:var(--ink2);margin-bottom:12px}
.note.warn{border-left-color:var(--time);background:var(--time-bg)}
.note.stop{border-left-color:var(--stop);background:var(--stop-bg)}
.note b{color:var(--ink)}
.metric-row{display:flex;gap:8px;margin-bottom:12px}
.metric{flex:1;background:var(--paper2);border-radius:var(--r-sm);padding:11px 8px;text-align:center;
  border-top:2px solid var(--acc,var(--brand))}
.mv{font-family:var(--display);font-size:1.42rem;font-weight:500;line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums}
.ml{font-family:var(--mono);font-size:.52rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.28}
.cam-ring{border-radius:50%;overflow:hidden;position:relative;background:var(--ink);display:grid;place-items:center}
.cam-ring.live{animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(176,58,46,.35)}50%{box-shadow:0 0 0 18px rgba(176,58,46,0)}}
.countdown{font-family:var(--display);font-size:2.8rem;text-align:center;line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}
.cite{font-family:var(--mono);font-size:.62rem;line-height:1.62;color:var(--muted);padding:9px 0;border-bottom:1px solid var(--line)}
.cite:last-child{border-bottom:none}
.cite b{color:var(--ink2);font-weight:600}
.footer-note{font-size:.65rem;line-height:1.58;color:var(--line2);text-align:center;padding:20px 6px 0;
  border-top:1px solid var(--line);margin-top:24px}
.prog{display:flex;gap:4px;margin-bottom:18px}
.prog i{flex:1;height:3px;border-radius:2px;background:var(--paper3)}
.prog i.on{background:var(--brand)}
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.61rem;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:13px}
.back:hover{color:var(--brand)}
.bar{height:6px;background:var(--paper3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
</style>

function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function seeded(x) {
  let a = x;
  return () => {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function generateDNA(name, age, goal) {
  const r = seeded(hash((name || 'guest') + age + goal)),

}

/* freshness multiplier for the blood layer */
function freshness(dateStr) {
  if (!dateStr) return {
    f: 0,
    days: null
  };
  const days = Math.round((Date.now() - new Date(dateStr).getTime()) / 864e5);
  let f = 1;
  if (days > 120) f = clamp(1 - (days - 120) / 120, 0, 1);
  return {
    f,
    days
  };
}

/* ── Resolver ─────────────────────────────────────────────────── */
function readiness(P, age) {
  if (!P) return null;
  const norm = Math.round(clamp(62 - (age - 25) * .5, 18, 62));
  const hrv = clamp(P.rmssd / norm * 55, 10, 72),
    hr = clamp((72 - P.heartRate) * 1.5 + 18, 0, 28);
  return {
    score: Math.round(clamp(hrv + hr, 15, 99)),
    norm
  };
}
function buildPlan(p) {
  const has = {
    dna: !!p.dna,
    blood: !!p.blood,
    ppg: !!p.ppg
  };
  const fresh = freshness(p.blood && p.blood._date);
  const goal = GOALS.find(g => g.k === p.goal) || GOALS[2];
  const sess = SESSIONS.find(s => s.k === p.session) || SESSIONS[0];
  const rdy = readiness(p.ppg, p.age);
  const tgt = goal.tgt;

  // interference for TODAY: base × goal weighting × session factor
  const intf = {};
  Object.keys(INTF).forEach(m => {
    const b = INTF[m];
    intf[m] = +clamp(b.hyp * tgt.hyp * sess.f + b.str * tgt.str * sess.f + b.end * tgt.end * sess.f, -1, 1).toFixed(2);
  });
  // and for a reference high-volume lifting day, so the week can be programmed
  const intfRef = {};
